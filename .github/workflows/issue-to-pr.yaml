name: Issue to PR with Codex

on:
  issues:
    types: [labeled]

jobs:
  fix_with_codex:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'codex' # 'codex'ラベルがついた時のみ実行

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Generate patch with Codex (non-interactive)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CI: "1"
          NO_COLOR: "1"
          TERM: "dumb"
        run: |
          set -euo pipefail

          BRANCH="codex/issue-${{ github.event.issue.number }}"
          git switch -c "$BRANCH"

          PROMPT_FILE=codex-prompt.txt
          {
            echo "${{ github.event.issue.title }}"
            echo
            echo "${{ github.event.issue.body }}"
            echo
            echo "最後に \`npm ci && npm run build\` を実行してエラーが出ないことを確認してください。"
            echo "dotfiles（.git 等）配下は絶対に変更しないでください。"
          } > "$PROMPT_FILE"

          # 非対話＆TTY不要モードで実行（承認フローなし）
          codex --ask-for-approval auto -- "$(cat "$PROMPT_FILE")"

          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "Fix: #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
            git push -u origin "$BRANCH"
          else
            echo "No changes generated by Codex."
            exit 0
          fi
          git push -u origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Fix: #${{ github.event.issue.number }} – ${{ github.event.issue.title }}" \
            --body  "Automated fix generated by Codex CLI." \
            --base  main \
            --head  "$BRANCH"
